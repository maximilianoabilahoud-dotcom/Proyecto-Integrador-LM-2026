<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Razas de gatos</title>
    <meta name="description" content="Página de contacto sobre el mundo de los gatos y resolución de dudas felinas.">
    <meta name="keywords" content="gatos, razas de gatos, contacto, adopción felina, cuidados de gatos">
    <meta name="author" content="Maximiliano Abilahoud Hidalgo">
</head>
<!-- Maximiliano Abilahoud Hidalgo 05/11/2026 -->
<body>
    <!-- BLOQUE CABECERA -->
    <div>
        <h1>Contacto y Consultas Felinas</h1>
        <p>Ponte en contacto con nosotros para resolver tus dudas sobre el mundo de los gatos.</p>
    </div>
    <!-- FIN BLOQUE CABECERA -->

    <!-- BLOQUE PRINCIPAL -->
    <div>
        <form action="#" method="post">
            
            <fieldset>
                <legend>Tus datos</legend>

                <div>
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" maxlength="50" autofocus required>
                </div>

                <div>
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@email.com" required>
                </div>

                <div>
                    <label for="telefono">Teléfono de contacto:</label>
                    <input type="tel" id="telefono" name="telefono" minlength="9" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Tu consulta</legend>

                <div>
                    <label for="motivo">Motivo de la consulta:</label>
                    <select id="motivo" name="motivo">
                        <option value="adopcion">Información sobre adopción</option>
                        <option value="cuidados" selected>Dudas sobre cuidados y salud</option>
                        <option value="razas">Consulta sobre razas específicas</option>
                        <option value="otro">Otro motivo</option>
                    </select>
                </div>

                <div>
                    <p>Preferencia de respuesta:</p>
                    <label for="pref_email">
                        <input type="radio" id="pref_email" name="preferencia" value="email" checked> Correo electrónico
                    </label>
                    <label for="pref_tel">
                        <input type="radio" id="pref_tel" name="preferencia" value="telefono"> Llamada telefónica
                    </label>
                    <label for="pref_whatsapp">
                        <input type="radio" id="pref_whatsapp" name="preferencia" value="whatsapp"> WhatsApp
                    </label>
                </div>

                <div>
                    <p>Temas de interés felino:</p>
                    <label for="interes_alimentacion">
                        <input type="checkbox" id="interes_alimentacion" name="intereses" value="alimentacion"> Alimentación y nutrición
                    </label>
                    <label for="interes_juguetes">
                        <input type="checkbox" id="interes_juguetes" name="intereses" value="juguetes"> Juguetes y rascadores
                    </label>
                    <label for="interes_veterinaria">
                        <input type="checkbox" id="interes_veterinaria" name="intereses" value="veterinaria"> Consejos veterinarios
                    </label>
                </div>

                <div>
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" minlength="10" placeholder="Escribe aquí los detalles de tu consulta sobre gatos..."></textarea>
                </div>

                <div>
                    <button type="submit">Enviar</button>
                    <button type="reset">Restablecer</button>
                </div>
            </fieldset>

        </form>
    </div>
    <!-- FIN BLOQUE PRINCIPAL -->
</body>
</html>
